[workspace]
members = ["crates/omniguard-core", "crates/omniguard-cli", "crates/omniguard-frontline"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tree-sitter = "0.27"
tree-sitter-solidity = "1.2.13"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
