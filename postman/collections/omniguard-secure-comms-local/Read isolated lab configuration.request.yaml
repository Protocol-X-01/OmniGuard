$kind: http-request
name: 'Read isolated lab configuration'
method: GET
url: '{{baseUrl}}/lab/config'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('No credentials in configuration',()=>{ pm.expect(pm.response.json().fixture).to.eql(true); pm.expect(JSON.stringify(pm.response.json())).not.to.include('password'); });
