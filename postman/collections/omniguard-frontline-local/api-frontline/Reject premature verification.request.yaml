$kind: http-request
name: 'Reject premature verification'
method: POST
url: '{{baseUrl}}/api/frontline/verify'
order: 3500
headers:
  - key: Content-Type
    value: application/json
  - key: X-OmniGuard-Local
    value: '1'
body:
  type: json
  content: |-
    {
      "id": "{{caseId}}",
      "digest": "{{digest}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('Unchanged evidence cannot verify',()=>pm.expect(pm.response.json().message).to.include('newer evidence'));
