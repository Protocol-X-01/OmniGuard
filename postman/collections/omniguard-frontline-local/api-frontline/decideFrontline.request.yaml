$kind: http-request
name: 'decideFrontline'
method: POST
url: '{{baseUrl}}/api/frontline/decision'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: X-OmniGuard-Local
    value: '1'
body:
  type: json
  content: |-
    {
      "id": "{{caseId}}",
      "digest": "{{digest}}",
      "decision": "confirmed",
      "reason": "verified_context"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Decision is recorded independently',()=>pm.expect(pm.response.json().decision).to.eql('confirmed'));
