$kind: http-request
name: 'Retry owner mention safely'
method: POST
url: '{{baseUrl}}/api/frontline/contact'
order: 3700
headers:
  - key: Content-Type
    value: application/json
  - key: X-OmniGuard-Local
    value: '1'
body:
  type: json
  content: |-
    {
      "id": "{{caseId}}",
      "digest": "{{digest}}",
      "reason": "request_context",
      "expiresAt": {{contactExpiry}},
      "token": "{{contactToken}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('No duplicate mention',()=>pm.expect(pm.response.json().duplicate).to.eql(true));
