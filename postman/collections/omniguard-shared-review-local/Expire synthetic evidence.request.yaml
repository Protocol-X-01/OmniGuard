$kind: http-request
name: Expire synthetic evidence
method: POST
url: '{{base_url}}/api/reviews/lab/expire'
order: 10000
headers:
  - key: Content-Type
    value: application/json
  - key: X-OmniGuard-Local
    value: '1'
  - key: X-OmniGuard-Actor
    value: owner
body:
  type: json
  content: |-
    {}
scripts:
