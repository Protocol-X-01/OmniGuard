$kind: http-request
name: Read expired review
method: GET
url: '{{base_url}}/api/reviews'
order: 11000
headers:
  - key: Content-Type
    value: application/json
  - key: X-OmniGuard-Local
    value: '1'
  - key: X-OmniGuard-Actor
    value: owner
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('freshness blocked',()=>pm.expect(pm.response.json().rows[0].reviewStatus).to.eql('Blocked'));
      const v=pm.response.json();const r=v.rows?v.rows[0]:v;if(r.id){pm.collectionVariables.set('id',r.id);pm.collectionVariables.set('rev',String(r.revision));pm.collectionVariables.set('token',r.evidenceToken);}
