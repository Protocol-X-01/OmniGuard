$kind: http-request
name: Record independent review
method: POST
url: '{{base_url}}/api/reviews/act'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: X-OmniGuard-Local
    value: '1'
  - key: X-OmniGuard-Actor
    value: reviewer
body:
  type: json
  content: |-
    {"id": "{{id}}", "revision": {{rev}}, "evidenceToken": "{{token}}", "action": "decide", "decision": "reviewed", "reason": "context_checked"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('review current',()=>pm.expect(pm.response.json().reviewed).to.eql(true));
      pm.test('no Jira completion',()=>pm.expect(pm.response.json().done).to.eql(false));
      const v=pm.response.json();const r=v.rows?v.rows[0]:v;if(r.id){pm.collectionVariables.set('id',r.id);pm.collectionVariables.set('rev',String(r.revision));pm.collectionVariables.set('token',r.evidenceToken);}
