$kind: http-request
name: Reject wrong recipient
method: POST
url: '{{base_url}}/api/reviews/act'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: X-OmniGuard-Local
    value: '1'
  - key: X-OmniGuard-Actor
    value: outsider
body:
  type: json
  content: |-
    {"id": "{{id}}", "revision": {{rev}}, "evidenceToken": "{{token}}", "action": "accept"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 403',()=>pm.response.to.have.status(403));
