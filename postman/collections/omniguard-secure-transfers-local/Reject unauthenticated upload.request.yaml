$kind: http-request
name: 'Reject unauthenticated upload'
method: POST
url: 'http://127.0.0.1:8998/_matrix/media/v3/upload'
order: 1000
headers:
  - key: Content-Type
    value: application/octet-stream
body:
  type: text
  content: 'synthetic-auth-boundary-only'
settings:
  followRedirects: false
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('Missing authentication rejected', () => pm.expect(pm.response.json().errcode).to.equal('M_MISSING_TOKEN'));
