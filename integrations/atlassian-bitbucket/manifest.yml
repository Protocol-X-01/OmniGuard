app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/ec3109cb-b4a0-412f-ba45-b02d51084942
modules:
  bitbucket:repoPullRequestOverviewPanel:
    - key: omniguard-bitbucket-pr-panel
      resource: app-ui
      resolver:
        function: app-resolver
      title: OmniGuard
  function:
    - key: app-resolver
      handler: index.handler
resources:
  - key: app-ui
    path: static/app
permissions:
  external:
    fetch:
      backend:
        - address: https://api.bitbucket.org
          inScopeEUD: true
